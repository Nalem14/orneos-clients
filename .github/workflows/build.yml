# Orneos clients: every day, look for a new official Nextcloud release; when there is one, bump versions.env,
# build the branded desktop apps on it (Linux, Windows, macOS; unsigned) and attach them to a draft GitHub release.
# Android only gets a compile check here: the signing key never leaves the server, which builds the signed APK
# (tools/client-build.sh in the orneos.eu repository) and publishes everything after a test install.
name: Build Orneos clients
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['versions.env', 'desktop/**', 'android/**', 'talk/**', 'talk-desktop/**', 'scripts/**', '.github/workflows/**']

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  upstream:
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.v.outputs.desktop }}
      android: ${{ steps.v.outputs.android }}
      talk: ${{ steps.v.outputs.talk }}
      talk_desktop: ${{ steps.v.outputs.talk_desktop }}
      changed: ${{ steps.bump.outputs.changed }}
      buildnr: ${{ steps.v.outputs.buildnr }}
    steps:
      - uses: actions/checkout@v4
      - name: New official release?
        id: bump
        run: |
          scripts/check-upstream.sh --write
          if git diff --quiet versions.env; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "orneos-bot" && git config user.email "contact@orneos.eu"
            . ./versions.env && git commit -qam "Upstream: desktop $DESKTOP_TAG, android $ANDROID_TAG" && git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - id: v
        # Build number: UTC year, day, hour (same scheme as tools/client-build.sh on the server), compared by the updater
        run: |
          . ./versions.env
          { echo "desktop=$DESKTOP_TAG"; echo "android=$ANDROID_TAG"; echo "talk=$TALK_TAG"; echo "talk_desktop=$TALK_DESKTOP_TAG"; echo "buildnr=$(date -u +%y%j%H)"; } >> "$GITHUB_OUTPUT"

  # The scheduled run only builds when a new official release came out
  android:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch ${{ needs.upstream.outputs.android }} https://github.com/nextcloud/android.git upstream
      - run: scripts/apply-android.sh upstream
      - run: scripts/build-android.sh upstream debug

  # Orneos Meet (nextcloud/talk-android): compile check; the signed APK is built on the server like Android's
  talk:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch ${{ needs.upstream.outputs.talk }} https://github.com/nextcloud/talk-android.git upstream
      - run: scripts/apply-talk.sh upstream
      - run: scripts/build-android.sh upstream debug

  linux:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch ${{ needs.upstream.outputs.desktop }} https://github.com/nextcloud/desktop.git upstream
      - run: ORNEOS_BUILDNR=${{ needs.upstream.outputs.buildnr }} scripts/apply-desktop.sh upstream
      - run: scripts/build-desktop-linux.sh upstream ${{ needs.upstream.outputs.buildnr }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: upstream/orneos-*.AppImage

  # KDE Craft, as in upstream's windows-build-and-test.yml; NSIS installer (Packager/PackageType in craftmaster.ini)
  windows:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: windows-2022
    env:
      CRAFT_TARGET: windows-msvc2022_64-cl
      CRAFT_MASTER_LOCATION: ${{ github.workspace }}\CraftMaster
      CRAFT_MASTER_CONFIG: ${{ github.workspace }}\upstream\craftmaster.ini
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch ${{ needs.upstream.outputs.desktop }} https://github.com/nextcloud/desktop.git upstream
        shell: bash
      - run: ORNEOS_BUILDNR=${{ needs.upstream.outputs.buildnr }} scripts/apply-desktop.sh upstream
        shell: bash
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Craft refs
        id: refs
        shell: bash
        run: |
          echo "kde=$(grep -oP 'craft-blueprints-kde\.revision\s*=\s*\K\S+' upstream/craftmaster.ini)" >> "$GITHUB_OUTPUT"
          echo "nextcloud=$(grep -oP 'craft-blueprints-nextcloud\.revision\s*=\s*\K\S+' upstream/craftmaster.ini)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: |
            ${{ env.CRAFT_MASTER_LOCATION }}
            ${{ github.workspace }}\craft-clone
            ${{ github.workspace }}\${{ env.CRAFT_TARGET }}
          key: craft-${{ env.CRAFT_TARGET }}-${{ needs.upstream.outputs.desktop }}
      - name: Craft and dependencies
        shell: pwsh
        run: |
          if (!(Test-Path "${{ env.CRAFT_MASTER_LOCATION }}")) {
            & cmd /C "git clone -q --depth=1 https://invent.kde.org/packaging/craftmaster.git ${{ env.CRAFT_MASTER_LOCATION }} 2>&1"
          }
          function craft() {
            python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-kde.git|${{ steps.refs.outputs.kde }}|"
          craft --add-blueprint-repository "https://github.com/nextcloud/craft-blueprints-nextcloud.git|${{ steps.refs.outputs.nextcloud }}|"
          craft craft
          craft --install-deps nextcloud-client
      - run: choco install inkscape -y --no-progress
      - name: Build and package (unsigned)
        shell: pwsh
        run: |
          echo "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          $env:PATH = "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\bin;$env:PATH"
          function craft() {
            python "${{ env.CRAFT_MASTER_LOCATION }}\CraftMaster.py" --config "${{ env.CRAFT_MASTER_CONFIG }}" --target ${{ env.CRAFT_TARGET }} -c $args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          # The recipe names the installer, its shortcuts (the executable) and the uninstall entry: Orneos
          python scripts/patch-craft-blueprint.py "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\etc\blueprints\locations\craft-blueprints-nextcloud\nextcloud-client\nextcloud-client.py" desktop\Orneos-installer.ico
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          craft --src-dir "${{ github.workspace }}\upstream" nextcloud-client
          craft --src-dir "${{ github.workspace }}\upstream" --package nextcloud-client
          # Craft writes <craft root>\tmp\nextcloud-client-<…>.exe
          New-Item -ItemType Directory -Force dist | Out-Null
          $exe = Get-ChildItem "${{ github.workspace }}\${{ env.CRAFT_TARGET }}\tmp\*.exe" | Sort-Object LastWriteTime | Select-Object -Last 1
          if (!$exe) { Write-Error "no installer found"; exit 1 }
          $version = "${{ needs.upstream.outputs.desktop }}".TrimStart('v') + ".${{ needs.upstream.outputs.buildnr }}"
          Copy-Item $exe.FullName "dist\Orneos-$version-x64-setup.exe"
          # The installer must really ship the client (Craft's blacklist once stripped it): open it and look
          & "C:\Program Files\7-Zip\7z.exe" x -y -o"$env:RUNNER_TEMP\setup" $exe.FullName | Out-Null
          $payload = Get-ChildItem "$env:RUNNER_TEMP\setup\*.7z" | Select-Object -First 1
          $listing = & "C:\Program Files\7-Zip\7z.exe" l $payload.FullName
          foreach ($f in @('bin\orneos.exe', 'bin\orneoscmd.exe', 'bin\orneossync.dll')) {
            if (!($listing | Select-String -SimpleMatch $f -Quiet)) { Write-Error "installer is missing $f"; exit 1 }
          }
          Get-ChildItem dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  # admin/osx/mac-crafter: Craft + app bundle, then a DMG. No Apple signature (ad hoc only). Sparkle updates,
  # verified with our EdDSA key (desktop/sparkle-ed25519.pub; the server signs each published DMG).
  macos:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    runs-on: macos-26 # Xcode 26 SDK required (NSGlassEffectView), like upstream CI
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch ${{ needs.upstream.outputs.desktop }} https://github.com/nextcloud/desktop.git upstream
      - run: ORNEOS_BUILDNR=${{ needs.upstream.outputs.buildnr }} scripts/apply-desktop.sh upstream
      - name: Build (arm64, unsigned)
        working-directory: upstream/admin/osx/mac-crafter
        run: |
          KDE=$(sed -n 's/^craft\/craft-blueprints-kde\.revision *= *//p' ../../../craftmaster.ini)
          swift run mac-crafter build --app-name Orneos --arch arm64 --build-type Release \
            --kde-blueprints-git-ref "$KDE" \
            --build-path "$RUNNER_TEMP/build" --product-path "$RUNNER_TEMP/product"
      - name: DMG (drag Orneos.app to Applications)
        run: |
          APP="$RUNNER_TEMP/product/Orneos.app"
          [ -d "$APP" ] || { echo "Orneos.app not built"; exit 1; }
          [ -x "$APP/Contents/MacOS/Orneos" ] || { echo "Orneos.app has no executable"; ls "$APP/Contents/MacOS"; exit 1; }
          [ -d "$APP/Contents/Frameworks/Sparkle.framework" ] || { echo "Sparkle missing: no automatic updates"; exit 1; }
          grep -qF "$(cat "$GITHUB_WORKSPACE/desktop/sparkle-ed25519.pub")" "$APP/Contents/Info.plist" || { echo "Info.plist lacks our Sparkle key"; exit 1; }
          # No Apple account: one consistent ad hoc signature over the app and its frameworks (Sparkle included)
          codesign --force --deep --sign - "$APP" && codesign --verify --deep --strict "$APP"
          VERSION="${{ needs.upstream.outputs.desktop }}"; VERSION="${VERSION#v}.${{ needs.upstream.outputs.buildnr }}"
          mkdir -p "$RUNNER_TEMP/dmg" dist
          cp -R "$APP" "$RUNNER_TEMP/dmg/" && ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -volname Orneos -srcfolder "$RUNNER_TEMP/dmg" -ov -format UDZO "dist/Orneos-$VERSION-macos-arm64.dmg"
          ls -la dist
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  # Orneos Meet for desktop (nextcloud/talk-desktop, Electron): official branding hook, unsigned like the sync client
  meet-desktop:
    needs: upstream
    if: github.event_name != 'schedule' || needs.upstream.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, build: 'build:linux', package: 'package:linux', label: linux-x64 }
          - { os: windows-latest, build: 'build:windows:x64', package: 'package:windows:x64:exe', label: windows-x64 }
          - { os: macos-15, build: 'build:mac', package: 'package:mac', label: macos-universal }
    runs-on: ${{ matrix.os }}
    # talk-desktop defaults CHANNEL to "dev" (title bar "… Dev"); published builds must be stable
    env:
      CHANNEL: stable
    defaults:
      run: { shell: bash }
    steps:
      - uses: actions/checkout@v4
      - run: git clone -q --depth 1 --branch ${{ needs.upstream.outputs.talk_desktop }} https://github.com/nextcloud/talk-desktop.git upstream
      - run: scripts/apply-talk-desktop.sh upstream
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Build
        working-directory: upstream
        run: npm ci --no-audit --no-fund && npm run ${{ matrix.build }}
      - name: Ad hoc signature (macOS refuses unsigned arm64 apps)
        if: runner.os == 'macOS'
        working-directory: upstream
        run: |
          APP=$(find out -maxdepth 2 -name 'Orneos Meet.app' -type d | head -1)
          [ -n "$APP" ] || { echo "Orneos Meet.app not found"; find out -maxdepth 3; exit 1; }
          codesign --force --deep --sign - "$APP" && codesign --verify --deep --strict "$APP"
      - name: Package
        working-directory: upstream
        run: npm run ${{ matrix.package }}
      - name: Collect
        run: |
          V="${{ needs.upstream.outputs.talk_desktop }}"; V="${V#v}"
          mkdir dist
          find upstream/out/make -type f \( -name '*.dmg' -o -name '*.exe' -o -name '*.zip' \) | while read -r f; do
            cp "$f" "dist/Orneos-Meet-$V-${{ matrix.label }}.${f##*.}"
          done
          ls -la dist; [ -n "$(ls dist)" ]
      - uses: actions/upload-artifact@v4
        with:
          name: meet-${{ matrix.label }}
          path: dist/*

  release:
    needs: [upstream, linux, windows, macos, meet-desktop]
    if: always() && needs.linux.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Draft release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release create "build-${{ github.run_number }}" --repo "${{ github.repository }}" --draft \
            --title "Orneos desktop ${{ needs.upstream.outputs.desktop }} (build ${{ needs.upstream.outputs.buildnr }})" \
            --notes "Built from nextcloud/desktop ${{ needs.upstream.outputs.desktop }} with the Orneos overlay at ${{ github.sha }}. Windows: ${{ needs.windows.result }}, macOS: ${{ needs.macos.result }}, Orneos Meet desktop ${{ needs.upstream.outputs.talk_desktop }}: ${{ needs.meet-desktop.result }}." \
            dist/*/*
